<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#15803d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Project Rimpang Digital Kreatif</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        rimpang: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    },
                    boxShadow: {
                        'up': '0 -4px 20px -5px rgba(0, 0, 0, 0.1)',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none; /* Mencegah pull-to-refresh bawaan browser yang mengganggu */
        }
        
        /* Hilangkan scrollbar untuk tampilan aplikasi yang bersih */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        .modal-overlay {
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        /* Bottom Sheet Style untuk Mobile */
        .modal-content {
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }
        @media (min-width: 640px) {
            .modal-content {
                transform: translateY(20px) scale(0.95);
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .modal-overlay.active .modal-content {
                transform: translateY(0) scale(1);
            }
        }

        .toast {
            transform: translateY(150%);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .loader {
            border: 3px solid #f3f4f6;
            border-radius: 50%;
            border-top: 3px solid #16a34a;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #app-container {
            max-width: 600px; /* Ukuran optimal mobile/tablet */
            margin: 0 auto;
            background: #f8fafc;
            height: 100dvh; /* Dynamic viewport height */
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.05);
        }

        .scrollable-area {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Styling spesifik untuk saat diunduh */
        .exporting .hide-on-export { display: none !important; }
        .exporting { padding-bottom: 20px !important; background: #f8fafc !important; }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-rimpang-100 selection:text-rimpang-900">

    <div id="app-container">
        
        <!-- Area Konten Utama (Yang akan diexport) -->
        <div id="capture-area" class="flex flex-col flex-1 scrollable-area pb-24 relative bg-slate-50">
            
            <!-- Header (Sticky) -->
            <header class="bg-gradient-to-br from-rimpang-800 to-rimpang-600 text-white pt-10 pb-6 px-5 rounded-b-[2.5rem] shadow-lg sticky top-0 z-10">
                <div class="flex justify-between items-start">
                    <div>
                        <h1 class="text-2xl font-extrabold tracking-tight">Project Rimpang</h1>
                        <p class="text-xs text-rimpang-100 mt-1.5 font-medium flex items-center opacity-90">
                            <i class="fa-solid fa-seedling mr-1.5"></i> Digital Kreatif App
                        </p>
                    </div>
                    <button onclick="downloadJPG()" class="hide-on-export bg-white/10 hover:bg-white/20 active:bg-white/30 text-white p-2.5 rounded-full backdrop-blur-md border border-white/20 transition flex items-center justify-center shadow-sm">
                        <i class="fa-solid fa-camera text-lg"></i>
                    </button>
                </div>
                
                <!-- Statistik Real-time -->
                <div class="grid grid-cols-3 gap-3 mt-6">
                    <div class="bg-white/10 rounded-2xl p-3 text-center backdrop-blur-md border border-white/10 shadow-inner">
                        <div class="text-2xl font-bold" id="stat-pending">0</div>
                        <div class="text-[9px] font-bold uppercase tracking-widest text-rimpang-100 mt-1">Tertunda</div>
                    </div>
                    <div class="bg-white/10 rounded-2xl p-3 text-center backdrop-blur-md border border-white/10 shadow-inner relative overflow-hidden">
                        <div class="absolute inset-0 bg-blue-400/20"></div>
                        <div class="text-2xl font-bold relative z-10" id="stat-progress">0</div>
                        <div class="text-[9px] font-bold uppercase tracking-widest text-rimpang-100 mt-1 relative z-10">Proses</div>
                    </div>
                    <div class="bg-white/10 rounded-2xl p-3 text-center backdrop-blur-md border border-white/10 shadow-inner relative overflow-hidden">
                        <div class="absolute inset-0 bg-green-400/20"></div>
                        <div class="text-2xl font-bold relative z-10" id="stat-done">0</div>
                        <div class="text-[9px] font-bold uppercase tracking-widest text-rimpang-100 mt-1 relative z-10">Selesai</div>
                    </div>
                </div>
            </header>

            <!-- Daftar Jadwal (Task List) -->
            <main class="flex-1 px-4 pt-6 space-y-4" id="task-list">
                <!-- Status Loading Awal -->
                <div id="initial-loader" class="flex flex-col items-center justify-center py-20 text-slate-400">
                    <div class="loader mb-4"></div>
                    <p class="text-sm font-medium">Menyinkronkan data awan...</p>
                </div>
                <!-- Kartu Tugas (Task Cards) akan dirender di sini -->
            </main>
            
            <!-- Watermark Khusus Hasil Unduhan (Disembunyikan di UI) -->
            <div id="export-watermark" class="hidden text-center flex-col items-center justify-center py-8 opacity-60">
                <div class="flex items-center gap-2 text-rimpang-700 font-bold text-sm mb-1">
                    <i class="fa-solid fa-seedling"></i> Project Rimpang
                </div>
                <div class="text-[10px] font-medium text-slate-400" id="export-date"></div>
            </div>
        </div>

        <!-- Tombol Tambah Mengambang (FAB) -->
        <div class="absolute bottom-6 left-0 right-0 flex justify-center pointer-events-none z-20 hide-on-export">
            <button onclick="openModal('add')" class="pointer-events-auto bg-gradient-to-r from-rimpang-600 to-rimpang-500 text-white h-14 px-8 rounded-full shadow-[0_10px_25px_-5px_rgba(22,163,74,0.5)] flex items-center justify-center text-sm font-bold gap-2 transition-transform active:scale-95 border border-rimpang-400/50">
                <i class="fa-solid fa-plus text-lg"></i> Tambah Jadwal
            </button>
        </div>
    </div>

    <div id="task-modal" class="modal-overlay fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4">
        <div class="modal-content bg-white w-full sm:max-w-md h-[90vh] sm:h-auto sm:max-h-[90vh] rounded-t-3xl sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden">
            
            <!-- Header Modal -->
            <div class="bg-white border-b border-slate-100 p-5 flex justify-between items-center z-10 shrink-0">
                <h2 id="modal-title" class="text-lg font-bold text-slate-800">Tambah Jadwal Baru</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 bg-slate-50 w-8 h-8 rounded-full flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <!-- Isi Formulir -->
            <div class="overflow-y-auto flex-1 p-5 scrollable-area bg-slate-50/50">
                <form id="task-form" class="space-y-5">
                    <input type="hidden" id="task-id">
                    
                    <!-- Judul -->
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Judul Tugas <span class="text-red-500">*</span></label>
                        <input type="text" id="task-title" required class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-rimpang-500/50 focus:border-rimpang-500 outline-none transition text-sm font-medium text-slate-800 shadow-sm" placeholder="Maks. 50 karakter">
                    </div>

                    <!-- Deskripsi -->
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Catatan / Deskripsi</label>
                        <textarea id="task-desc" rows="3" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-rimpang-500/50 focus:border-rimpang-500 outline-none transition resize-none text-sm font-medium text-slate-800 shadow-sm" placeholder="Rincian pekerjaan..."></textarea>
                    </div>

                    <!-- Tanggal -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Tgl Mulai <span class="text-red-500">*</span></label>
                            <div class="relative">
                                <input type="date" id="task-start" required class="w-full pl-3 pr-2 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-rimpang-500/50 outline-none text-sm font-medium text-slate-700 shadow-sm appearance-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Tgl Selesai <span class="text-red-500">*</span></label>
                            <input type="date" id="task-end" required class="w-full pl-3 pr-2 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-rimpang-500/50 outline-none text-sm font-medium text-slate-700 shadow-sm appearance-none">
                        </div>
                    </div>

                    <!-- Status & Prioritas -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Status <span class="text-red-500">*</span></label>
                            <select id="task-status" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-rimpang-500/50 outline-none text-sm font-medium text-slate-700 shadow-sm appearance-none bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20fill%3D%22none%22%20stroke%3D%22%2394a3b8%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E')] bg-no-repeat bg-[position:right_12px_center] bg-[length:16px]">
                                <option value="pending">⏳ Tertunda</option>
                                <option value="progress">🔄 Diproses</option>
                                <option value="done">✅ Selesai</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Prioritas</label>
                            <select id="task-priority" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-rimpang-500/50 outline-none text-sm font-medium text-slate-700 shadow-sm appearance-none bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20fill%3D%22none%22%20stroke%3D%22%2394a3b8%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E')] bg-no-repeat bg-[position:right_12px_center] bg-[length:16px]">
                                <option value="low">🟢 Rendah</option>
                                <option value="medium" selected>🟡 Sedang</option>
                                <option value="high">🔴 Tinggi</option>
                            </select>
                        </div>
                    </div>

                    <!-- PIC -->
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Penanggung Jawab (PIC)</label>
                        <div class="relative">
                            <i class="fa-solid fa-user-astronaut absolute left-4 top-3.5 text-slate-400"></i>
                            <input type="text" id="task-pic" class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-rimpang-500/50 outline-none text-sm font-medium text-slate-700 shadow-sm" placeholder="Nama anggota tim">
                        </div>
                    </div>

                    <!-- Lampiran Gambar -->
                    <div class="pb-4">
                        <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Lampiran (Opsional)</label>
                        <div class="border-2 border-dashed border-slate-300 rounded-2xl p-1 bg-white hover:bg-slate-50 transition relative overflow-hidden group">
                            
                            <!-- Input File Asli (Transparan menutupi seluruh area) -->
                            <input type="file" id="task-image" accept="image/jpeg, image/png, image/webp" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onchange="handleImageUpload(event)">
                            
                            <!-- Area Prompt (Sebelum ada gambar) -->
                            <div id="image-upload-prompt" class="flex flex-col items-center justify-center py-6 pointer-events-none">
                                <div class="w-12 h-12 bg-rimpang-50 rounded-full flex items-center justify-center mb-2 group-hover:scale-110 transition-transform">
                                    <i class="fa-solid fa-camera-retro text-xl text-rimpang-500"></i>
                                </div>
                                <span class="text-sm text-slate-700 font-bold">Ambil/Pilih Gambar</span>
                                <span class="text-[10px] text-slate-400 font-medium mt-1">Dikompresi otomatis agar ringan</span>
                            </div>

                            <!-- Area Preview (Setelah ada gambar) -->
                            <div id="image-preview-container" class="hidden relative rounded-xl overflow-hidden bg-slate-900">
                                <img id="image-preview" src="" alt="Preview" class="w-full h-40 object-contain">
                                <!-- Tombol Hapus Gambar -->
                                <button type="button" onclick="removeImage(event)" class="absolute top-2 right-2 bg-white/90 text-red-600 w-8 h-8 rounded-full flex items-center justify-center shadow-lg hover:bg-red-50 active:scale-95 transition z-20">
                                    <i class="fa-solid fa-trash-can text-sm"></i>
                                </button>
                                <!-- Indikator Loading Kompresi -->
                                <div id="image-compressing-indicator" class="hidden absolute inset-0 bg-slate-900/50 flex flex-col items-center justify-center z-15 backdrop-blur-sm">
                                    <div class="loader mb-2 border-t-white"></div>
                                    <span class="text-white text-xs font-bold">Memproses...</span>
                                </div>
                            </div>
                        </div>
                        <input type="hidden" id="task-image-base64">
                    </div>
                </form>
            </div>

            <!-- Footer Modal (Tombol Aksi) -->
            <div class="bg-white border-t border-slate-100 p-5 shrink-0 flex gap-3 shadow-[0_-4px_10px_rgba(0,0,0,0.02)]">
                <button type="button" onclick="closeModal()" class="flex-1 px-4 py-3.5 bg-slate-100 text-slate-700 rounded-xl font-bold text-sm active:bg-slate-200 transition">Batal</button>
                <button type="submit" form="task-form" id="submit-btn" class="flex-[2] px-4 py-3.5 bg-rimpang-600 text-white rounded-xl font-bold text-sm hover:bg-rimpang-700 active:bg-rimpang-800 transition shadow-md flex justify-center items-center">
                    <span id="submit-text">Simpan Jadwal</span>
                    <div id="submit-loader" class="loader hidden ml-2 w-4 h-4 border-[2px] border-rimpang-600 border-t-white"></div>
                </button>
            </div>
        </div>
    </div>

    <div id="image-modal" class="modal-overlay fixed inset-0 z-[60] flex items-center justify-center bg-black/95 p-0 sm:p-8" onclick="closeImageModal()">
        <button class="absolute top-safe right-4 top-4 bg-white/10 text-white w-10 h-10 rounded-full flex items-center justify-center backdrop-blur-md active:bg-white/20 z-10 transition">
            <i class="fa-solid fa-xmark text-lg"></i>
        </button>
        <div class="w-full h-full flex items-center justify-center p-2">
            <img id="full-image" src="" class="max-w-full max-h-full object-contain rounded-lg modal-content" onclick="event.stopPropagation()">
        </div>
    </div>

    <div id="toast" class="toast fixed bottom-24 sm:bottom-10 left-4 right-4 sm:left-1/2 sm:-translate-x-1/2 sm:w-auto bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center z-[70] border border-slate-800 backdrop-blur-md bg-opacity-95">
        <div id="toast-icon-bg" class="w-8 h-8 rounded-full bg-green-500/20 flex items-center justify-center mr-3 shrink-0">
            <i id="toast-icon" class="fa-solid fa-check text-green-400 text-sm"></i>
        </div>
        <span id="toast-msg" class="text-sm font-semibold flex-1">Pesan notifikasi</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        /* INISIALISASI VARIABEL GLOBAL */
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'project-rimpang-kreatif';
        let firebaseConfig = null;
        let app, db, auth;
        let currentUser = null;
        let tasksData = []; 
        let unsubscribeTasks = null;
        let isCompressing = false;
        let useCloud = false;

        /* PENGATURAN FIREBASE (Sesuai Aturan Sistem) */
        try {
            if (typeof __firebase_config !== 'undefined') {
                firebaseConfig = JSON.parse(__firebase_config);
            }
        } catch (e) {
            console.warn("Menggunakan environment fallback.");
        }

        if (firebaseConfig) {
            useCloud = true;
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            
            const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

            const initAuth = async () => {
                try {
                    if (initialAuthToken) {
                        await signInWithCustomToken(auth, initialAuthToken);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (error) {
                    console.error("Auth error:", error);
                    showToast("Gagal terhubung ke Cloud.", "error");
                }
            };

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    setupRealtimeListener();
                }
            });

            initAuth();
        } else {
            console.warn("Cloud config missing. Beralih ke mode memori lokal.");
            useCloud = false;
            
            // Hapus pesan eror dan tampilkan antarmuka kosong setelah jeda
            setTimeout(() => {
                const initialLoader = document.getElementById('initial-loader');
                if (initialLoader) initialLoader.remove();
                renderTasks();
                updateStats();
                showToast("Sistem berjalan dalam mode sesi lokal", "success");
            }, 800);
        }

        /* FUNGSI SINKRONISASI DATA (Real-time) */
        function setupRealtimeListener() {
            if (!useCloud || !currentUser) return;
            
            // Aturan Strict: public/data/schedules
            const tasksRef = collection(db, 'artifacts', appId, 'public', 'data', 'schedules');
            const q = query(tasksRef); // No complex queries allowed
            
            unsubscribeTasks = onSnapshot(q, (snapshot) => {
                tasksData = [];
                snapshot.forEach((doc) => {
                    tasksData.push({ id: doc.id, ...doc.data() });
                });
                
                // Urutkan di memori (Terbaru di atas)
                tasksData.sort((a, b) => {
                    if (a.createdAt && b.createdAt) {
                        return b.createdAt.toMillis() - a.createdAt.toMillis();
                    }
                    return 0;
                });

                renderTasks();
                updateStats();
                
                // Hilangkan loader awal jika ada
                const initialLoader = document.getElementById('initial-loader');
                if (initialLoader) initialLoader.remove();
                
            }, (error) => {
                console.error("Error sinkronisasi:", error);
                showToast("Koneksi data terputus.", "error");
            });
        }

        /* FUNGSI KONTROL MODAL (Global) */
        window.openModal = (mode, id = null) => {
            const modal = document.getElementById('task-modal');
            const form = document.getElementById('task-form');
            form.reset();
            
            // Reset state gambar
            document.getElementById('image-preview-container').classList.add('hidden');
            document.getElementById('image-upload-prompt').classList.remove('hidden');
            document.getElementById('task-image-base64').value = "";
            document.getElementById('task-image').value = "";
            
            if (mode === 'add') {
                document.getElementById('modal-title').textContent = "Tambah Jadwal";
                document.getElementById('task-id').value = "";
                // Set default tanggal = hari ini
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('task-start').value = today;
                document.getElementById('task-end').value = today;
            } else if (mode === 'edit' && id) {
                document.getElementById('modal-title').textContent = "Edit Jadwal";
                const task = tasksData.find(t => t.id === id);
                if (task) {
                    document.getElementById('task-id').value = id;
                    document.getElementById('task-title').value = task.title || "";
                    document.getElementById('task-desc').value = task.description || "";
                    document.getElementById('task-start').value = task.startDate || "";
                    document.getElementById('task-end').value = task.endDate || "";
                    document.getElementById('task-status').value = task.status || "pending";
                    document.getElementById('task-priority').value = task.priority || "medium";
                    document.getElementById('task-pic').value = task.pic || "";
                    
                    if (task.image) {
                        document.getElementById('image-preview').src = task.image;
                        document.getElementById('image-preview-container').classList.remove('hidden');
                        document.getElementById('image-upload-prompt').classList.add('hidden');
                        document.getElementById('task-image-base64').value = task.image;
                    }
                }
            }
            
            modal.classList.add('active');
        };

        window.closeModal = () => {
            document.getElementById('task-modal').classList.remove('active');
        };

        /* KONFIGURASI TAMPILAN UI (Badge, Icon) */
        const statusConfig = {
            'pending': { label: 'Tertunda', icon: 'fa-clock', color: 'text-orange-600', bg: 'bg-orange-100', border: 'border-orange-200' },
            'progress': { label: 'Diproses', icon: 'fa-gears', color: 'text-blue-600', bg: 'bg-blue-100', border: 'border-blue-200' },
            'done': { label: 'Selesai', icon: 'fa-circle-check', color: 'text-green-600', bg: 'bg-green-100', border: 'border-green-200' }
        };

        const priorityConfig = {
            'low': { label: 'Rendah', color: 'text-slate-500', icon: 'fa-arrow-down' },
            'medium': { label: 'Sedang', color: 'text-yellow-600', icon: 'fa-minus' },
            'high': { label: 'Tinggi', color: 'text-red-500', icon: 'fa-arrow-up' }
        };

        const formatDate = (dateStr) => {
            if (!dateStr) return "-";
            const options = { day: 'numeric', month: 'short' };
            const date = new Date(dateStr);
            return date.toLocaleDateString('id-ID', options);
        };

        /* FUNGSI RENDER TAMPILAN JADWAL */
        function renderTasks() {
            const listEl = document.getElementById('task-list');
            
            if (tasksData.length === 0) {
                listEl.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-16 text-center px-4">
                        <div class="w-20 h-20 bg-rimpang-50 rounded-full flex items-center justify-center mb-4 border border-rimpang-100 shadow-inner">
                            <i class="fa-solid fa-clipboard-list text-3xl text-rimpang-400"></i>
                        </div>
                        <h3 class="text-base font-bold text-slate-700 mb-1">Belum Ada Jadwal</h3>
                        <p class="text-xs text-slate-500 max-w-[200px]">Buat jadwal pertamamu dengan menekan tombol di bawah.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            tasksData.forEach(task => {
                const stat = statusConfig[task.status] || statusConfig['pending'];
                const prio = priorityConfig[task.priority] || priorityConfig['medium'];
                
                let imgHtml = '';
                if (task.image) {
                    imgHtml = `
                        <div class="mt-3 rounded-xl overflow-hidden border border-slate-100 bg-slate-900 cursor-pointer relative" onclick="viewImage('${task.image}')">
                            <img src="${task.image}" alt="Lampiran" class="w-full h-36 object-cover opacity-90">
                            <div class="absolute inset-0 bg-black/10 flex items-center justify-center opacity-0 hover:opacity-100 transition">
                                <div class="bg-white/90 backdrop-blur-sm w-10 h-10 rounded-full flex items-center justify-center text-slate-800 shadow-lg">
                                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                                </div>
                            </div>
                        </div>
                    `;
                }

                html += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 relative hide-on-export-adjust">
                        
                        <!-- Header Card: Status & Opsi -->
                        <div class="flex justify-between items-start mb-2">
                            <span class="px-2.5 py-1 text-[10px] font-extrabold uppercase tracking-widest rounded-full ${stat.bg} ${stat.color} border ${stat.border} flex items-center gap-1.5 shadow-sm">
                                <i class="fa-solid ${stat.icon}"></i> ${stat.label}
                            </span>
                            
                            <div class="flex gap-1.5 hide-on-export">
                                <button onclick="openModal('edit', '${task.id}')" class="w-8 h-8 rounded-full bg-slate-50 text-slate-500 hover:text-blue-600 hover:bg-blue-50 flex items-center justify-center transition" title="Edit">
                                    <i class="fa-solid fa-pen text-xs"></i>
                                </button>
                                <button onclick="confirmDelete('${task.id}')" class="w-8 h-8 rounded-full bg-slate-50 text-slate-500 hover:text-red-600 hover:bg-red-50 flex items-center justify-center transition" title="Hapus">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                </button>
                            </div>
                        </div>
                        
                        <!-- Konten Utama Card -->
                        <h3 class="text-base font-bold text-slate-800 leading-tight mb-1 pr-12">${task.title}</h3>
                        ${task.description ? `<p class="text-xs text-slate-500 leading-relaxed line-clamp-2">${task.description}</p>` : ''}
                        
                        ${imgHtml}

                        <!-- Footer Card: Info & Tanggal -->
                        <div class="mt-3 pt-3 border-t border-slate-50 flex flex-wrap gap-2 text-[11px] font-semibold text-slate-600">
                            <div class="flex items-center gap-1.5 bg-slate-50 px-2.5 py-1.5 rounded-lg border border-slate-100">
                                <i class="fa-regular fa-calendar text-rimpang-600"></i>
                                <span>${formatDate(task.startDate)} <i class="fa-solid fa-arrow-right text-[9px] mx-0.5 opacity-40"></i> ${formatDate(task.endDate)}</span>
                            </div>
                            ${task.pic ? `
                            <div class="flex items-center gap-1.5 bg-slate-50 px-2.5 py-1.5 rounded-lg border border-slate-100">
                                <i class="fa-solid fa-user-astronaut text-rimpang-600"></i>
                                <span class="max-w-[100px] truncate">${task.pic}</span>
                            </div>
                            ` : ''}
                            <div class="flex items-center gap-1.5 bg-slate-50 px-2.5 py-1.5 rounded-lg border border-slate-100 ml-auto">
                                <i class="fa-solid ${prio.icon} ${prio.color}"></i>
                            </div>
                        </div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        /* FUNGSI HITUNG STATISTIK */
        function updateStats() {
            let pending = 0, progress = 0, done = 0;
            tasksData.forEach(t => {
                if (t.status === 'pending') pending++;
                if (t.status === 'progress') progress++;
                if (t.status === 'done') done++;
            });
            
            document.getElementById('stat-pending').textContent = pending;
            document.getElementById('stat-progress').textContent = progress;
            document.getElementById('stat-done').textContent = done;
        }

        window.handleImageUpload = (event) => {
            const file = event.target.files[0];
            if (!file) return;

            if (!file.type.match('image.*')) {
                showToast("Hanya file gambar JPG/PNG.", "error");
                event.target.value = ''; // reset input
                return;
            }

            // UI Feedback saat memproses
            isCompressing = true;
            document.getElementById('image-upload-prompt').classList.add('hidden');
            const previewContainer = document.getElementById('image-preview-container');
            previewContainer.classList.remove('hidden');
            document.getElementById('image-compressing-indicator').classList.remove('hidden');
            document.getElementById('submit-btn').disabled = true;

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // Batas maksimal dimensi agar size kecil (Max 600px ideal untuk mobile web)
                    const MAX_DIMENSION = 600; 
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_DIMENSION) {
                            height *= MAX_DIMENSION / width;
                            width = MAX_DIMENSION;
                        }
                    } else {
                        if (height > MAX_DIMENSION) {
                            width *= MAX_DIMENSION / height;
                            height = MAX_DIMENSION;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    
                    // Gambar ulang dengan kualitas kompresi
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Kompres ke JPEG dengan kualitas 0.5 (Sangat aman untuk batasan Firestore)
                    const base64String = canvas.toDataURL('image/jpeg', 0.5);
                    
                    // Pengecekan keamanan ukuran string (Estimasi ukuran byte base64)
                    const stringLength = base64String.length;
                    const sizeInBytes = 4 * Math.ceil((stringLength / 3))*0.5624896334383812; // Estimasi Kasar
                    const sizeInKb = sizeInBytes/1000;

                    if(sizeInKb > 900) { // Firestore limit is ~1048KB
                        showToast("Gambar masih terlalu besar setelah dikompres.", "error");
                        removeImage(new Event('click'));
                        return;
                    }

                    // Terapkan ke UI
                    document.getElementById('task-image-base64').value = base64String;
                    document.getElementById('image-preview').src = base64String;
                    
                    // Selesai memproses
                    document.getElementById('image-compressing-indicator').classList.add('hidden');
                    document.getElementById('submit-btn').disabled = false;
                    isCompressing = false;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.removeImage = (event) => {
            if(event) event.stopPropagation();
            document.getElementById('task-image-base64').value = "";
            document.getElementById('task-image').value = "";
            document.getElementById('image-preview').src = "";
            document.getElementById('image-preview-container').classList.add('hidden');
            document.getElementById('image-upload-prompt').classList.remove('hidden');
            
            // Hapus loading indicator jika tersangkut
            document.getElementById('image-compressing-indicator').classList.add('hidden');
            document.getElementById('submit-btn').disabled = false;
            isCompressing = false;
        };

        window.viewImage = (src) => {
            document.getElementById('full-image').src = src;
            document.getElementById('image-modal').classList.add('active');
        };

        window.closeImageModal = () => {
            document.getElementById('image-modal').classList.remove('active');
        };

        document.getElementById('task-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (isCompressing) {
                showToast("Tunggu gambar selesai diproses.", "error");
                return;
            }

            // Loading state tombol
            const submitBtn = document.getElementById('submit-btn');
            const submitText = document.getElementById('submit-text');
            const submitLoader = document.getElementById('submit-loader');
            
            submitBtn.disabled = true;
            submitText.classList.add('hidden');
            submitLoader.classList.remove('hidden');

            const id = document.getElementById('task-id').value;
            
            // Susun data
            const taskData = {
                title: document.getElementById('task-title').value.trim(),
                description: document.getElementById('task-desc').value.trim(),
                startDate: document.getElementById('task-start').value,
                endDate: document.getElementById('task-end').value,
                status: document.getElementById('task-status').value,
                priority: document.getElementById('task-priority').value,
                pic: document.getElementById('task-pic').value.trim(),
                image: document.getElementById('task-image-base64').value, // Base64 hasil kompres
            };

            try {
                if (useCloud) {
                    if (!currentUser) throw new Error("Koneksi awan belum siap.");
                    const tasksRef = collection(db, 'artifacts', appId, 'public', 'data', 'schedules');
                    taskData.updatedAt = serverTimestamp();

                    if (id) {
                        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'schedules', id);
                        await updateDoc(docRef, taskData);
                        showToast("Jadwal diperbarui.");
                    } else {
                        taskData.createdAt = serverTimestamp();
                        taskData.userId = currentUser.uid;
                        await addDoc(tasksRef, taskData);
                        showToast("Jadwal baru ditambahkan.");
                    }
                } else {
                    // MODE LOKAL (Tanpa Cloud)
                    if (id) {
                        const idx = tasksData.findIndex(t => t.id === id);
                        if (idx !== -1) {
                            tasksData[idx] = { ...tasksData[idx], ...taskData };
                            showToast("Jadwal diperbarui (Sesi Lokal).");
                        }
                    } else {
                        const newTask = {
                            ...taskData,
                            id: 'local_' + Date.now(),
                            createdAt: { toMillis: () => Date.now() } // Mock timestamp
                        };
                        tasksData.unshift(newTask);
                        showToast("Jadwal ditambahkan (Sesi Lokal).");
                    }
                    renderTasks();
                    updateStats();
                }
                closeModal();
            } catch (error) {
                console.error("Gagal simpan:", error);
                if(error.code === 'resource-exhausted' || (error.message && error.message.includes('too large'))) {
                    showToast("Gagal: Memori awan penuh (Gambar terlalu besar).", "error");
                } else {
                    showToast("Terjadi kesalahan saat menyimpan.", "error");
                }
            } finally {
                // Kembalikan tombol ke semula
                submitBtn.disabled = false;
                submitText.classList.remove('hidden');
                submitLoader.classList.add('hidden');
            }
        });

        window.confirmDelete = (id) => {
            const existingModal = document.getElementById('confirm-modal');
            if (existingModal) existingModal.remove();

            const modalHtml = `
            <div id="confirm-modal" class="modal-overlay fixed inset-0 z-[80] flex items-center justify-center p-4 active">
                <div class="bg-white rounded-3xl p-6 w-full max-w-[320px] shadow-2xl text-center transform scale-100 transition-transform flex flex-col items-center">
                    <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mb-4 text-red-500 shadow-inner">
                        <i class="fa-solid fa-trash-can text-2xl"></i>
                    </div>
                    <h3 class="text-lg font-bold text-slate-800 mb-1">Hapus Jadwal?</h3>
                    <p class="text-xs text-slate-500 mb-6 px-2">Data ini akan dihapus permanen dari semua perangkat.</p>
                    <div class="flex gap-3 w-full">
                        <button onclick="closeConfirmModal()" class="flex-1 px-4 py-3 bg-slate-100 text-slate-700 rounded-xl font-bold text-sm active:bg-slate-200 transition">Batal</button>
                        <button onclick="executeDelete('${id}')" class="flex-1 px-4 py-3 bg-red-500 text-white rounded-xl font-bold text-sm active:bg-red-600 transition shadow-md shadow-red-500/30">Hapus</button>
                    </div>
                </div>
            </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        };

        window.closeConfirmModal = () => {
            const modal = document.getElementById('confirm-modal');
            if(modal) {
                modal.classList.remove('active');
                setTimeout(() => modal.remove(), 300); // Tunggu animasi transisi
            }
        };

        window.executeDelete = async (id) => {
            // Ubah tombol hapus jadi loading indicator visual saja
            const btnHapus = document.querySelector('#confirm-modal button.bg-red-500');
            if(btnHapus) {
                btnHapus.innerHTML = '<div class="loader w-4 h-4 mx-auto border-t-white border-[2px]"></div>';
                btnHapus.disabled = true;
            }

            try {
                if (useCloud) {
                    if (!currentUser) return;
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'schedules', id);
                    await deleteDoc(docRef);
                    showToast("Jadwal dihapus.");
                } else {
                    // MODE LOKAL
                    tasksData = tasksData.filter(t => t.id !== id);
                    renderTasks();
                    updateStats();
                    showToast("Jadwal dihapus (Sesi Lokal).");
                }
                closeConfirmModal();
            } catch (error) {
                console.error("Gagal hapus:", error);
                showToast("Gagal menghapus data.", "error");
                closeConfirmModal();
            }
        };

        let toastTimeout;
        window.showToast = (message, type = "success") => {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-msg');
            const iconBg = document.getElementById('toast-icon-bg');
            const iconEl = document.getElementById('toast-icon');

            msgEl.textContent = message;
            
            if (type === "success") {
                iconBg.className = "w-8 h-8 rounded-full bg-green-500/20 flex items-center justify-center mr-3 shrink-0";
                iconEl.className = "fa-solid fa-check text-green-400 text-sm";
            } else {
                iconBg.className = "w-8 h-8 rounded-full bg-red-500/20 flex items-center justify-center mr-3 shrink-0";
                iconEl.className = "fa-solid fa-xmark text-red-400 text-sm";
            }

            toast.classList.add('show');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        };

        window.downloadJPG = async () => {
            const captureArea = document.getElementById('capture-area');
            const watermark = document.getElementById('export-watermark');
            const dateSpan = document.getElementById('export-date');
            
            showToast("Memproses gambar (HD)...");
            
            // Persiapan UI: Tambahkan kelas exporting untuk menyembunyikan scrollbar/elemen tak perlu
            captureArea.classList.add('exporting');
            
            // Set watermark date
            const now = new Date();
            dateSpan.textContent = "Diekspor pada " + now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            watermark.classList.remove('hidden');
            watermark.classList.add('flex'); // ganti hidden ke flex
            
            // Tunggu 100ms agar DOM merender perubahan CSS sebelum di-capture
            await new Promise(r => setTimeout(r, 100));

            try {
                const canvas = await html2canvas(captureArea, {
                    scale: 3, // Kualitas Tinggi (HD)
                    useCORS: true, 
                    allowTaint: true,
                    backgroundColor: "#f8fafc", 
                    windowWidth: captureArea.scrollWidth, // Pastikan lebar penuh
                    // Ambil tinggi keseluruhan, jangan potong di layar
                    windowHeight: captureArea.scrollHeight, 
                    height: captureArea.scrollHeight,
                    logging: false,
                    onclone: (clonedDoc) => {
                        // Perbaikan khusus untuk styling di clone jika perlu
                        const clonedArea = clonedDoc.getElementById('capture-area');
                        if(clonedArea) {
                            clonedArea.style.overflow = 'visible';
                            clonedArea.style.height = 'auto';
                        }
                    }
                });

                // Konversi dan Download (Kualitas 90%)
                const imageString = canvas.toDataURL("image/jpeg", 0.9);
                const link = document.createElement('a');
                link.download = `Jadwal_Rimpang_${now.getTime()}.jpg`;
                link.href = imageString;
                link.click();
                
                showToast("Gambar berhasil diunduh.");
            } catch (error) {
                console.error("Export error:", error);
                showToast("Gagal memproses gambar.", "error");
            } finally {
                // Kembalikan UI ke normal
                captureArea.classList.remove('exporting');
                watermark.classList.add('hidden');
                watermark.classList.remove('flex');
            }
        };

        // Pintasan Keyboard (Escape untuk menutup)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
                closeImageModal();
                closeConfirmModal();
            }
        });

    </script>
</body>
</html>
