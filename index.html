<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Project Rimpang Digital Kreatif</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- html2canvas untuk fitur unduh JPG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        rimpang: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease-in-out;
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal-content {
            transform: translateY(20px) scale(0.95);
            opacity: 0;
            transition: all 0.3s ease-in-out;
        }
        
        .modal-overlay.active .modal-content {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .toast {
            transform: translateY(100%);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Prevent image breaking out */
        img {
            max-width: 100%;
            height: auto;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #16a34a;
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #app-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            position: relative;
        }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-rimpang-100 selection:text-rimpang-900">

    <div id="app-container" class="flex flex-col">
        
        <!-- Area yang akan dicapture untuk JPG -->
        <div id="capture-area" class="flex flex-col flex-1 bg-gray-50 min-h-screen pb-24">
            
            <!-- Header -->
            <header class="bg-gradient-to-r from-rimpang-700 to-rimpang-500 text-white p-5 rounded-b-2xl shadow-lg sticky top-0 z-10">
                <div class="flex justify-between items-center">
                    <div>
                        <h1 class="text-xl font-bold tracking-tight">Project Rimpang</h1>
                        <p class="text-xs text-rimpang-100 mt-1 opacity-90"><i class="fa-solid fa-leaf mr-1"></i> Digital Kreatif Dashboard</p>
                    </div>
                    <button onclick="downloadJPG()" class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-xl text-sm font-medium transition flex items-center backdrop-blur-sm border border-white/10 shadow-sm">
                        <i class="fa-solid fa-download mr-2"></i> Unduh JPG
                    </button>
                </div>
                
                <!-- Stats Summary -->
                <div class="grid grid-cols-3 gap-3 mt-6">
                    <div class="bg-white/10 rounded-xl p-3 text-center backdrop-blur-sm border border-white/10">
                        <div class="text-2xl font-bold" id="stat-pending">0</div>
                        <div class="text-[10px] uppercase tracking-wider text-rimpang-50 mt-1">Tertunda</div>
                    </div>
                    <div class="bg-white/10 rounded-xl p-3 text-center backdrop-blur-sm border border-white/10">
                        <div class="text-2xl font-bold" id="stat-progress">0</div>
                        <div class="text-[10px] uppercase tracking-wider text-rimpang-50 mt-1">Proses</div>
                    </div>
                    <div class="bg-white/10 rounded-xl p-3 text-center backdrop-blur-sm border border-white/10">
                        <div class="text-2xl font-bold" id="stat-done">0</div>
                        <div class="text-[10px] uppercase tracking-wider text-rimpang-50 mt-1">Selesai</div>
                    </div>
                </div>
            </header>

            <!-- Main Content: Task List -->
            <main class="flex-1 p-4 space-y-4" id="task-list">
                <!-- Initial Loading State -->
                <div id="initial-loader" class="flex flex-col items-center justify-center py-20 text-slate-400">
                    <div class="loader mb-4"></div>
                    <p class="text-sm">Memuat jadwal proyek...</p>
                </div>
                <!-- Task Cards will be injected here -->
            </main>
            
            <!-- Watermark for Export (Hidden on UI, visible on JPG) -->
            <div id="export-watermark" class="hidden text-center text-xs text-gray-400 py-4 pb-8">
                Generated by Project Rimpang Digital Kreatif &bull; <span id="export-date"></span>
            </div>
        </div>

        <!-- Floating Action Button -->
        <button onclick="openModal('add')" class="fixed bottom-6 right-6 lg:right-[calc(50%-370px)] bg-rimpang-600 hover:bg-rimpang-700 text-white w-14 h-14 rounded-full shadow-[0_8px_16px_rgba(22,163,74,0.4)] flex items-center justify-center text-xl transition-transform hover:scale-105 z-20">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>

    <!-- Modal Formulir Tugas -->
    <div id="task-modal" class="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="modal-content bg-white rounded-2xl w-full max-w-md max-h-[90vh] overflow-y-auto shadow-2xl flex flex-col">
            <div class="sticky top-0 bg-white border-b border-gray-100 p-4 flex justify-between items-center z-10 rounded-t-2xl">
                <h2 id="modal-title" class="text-lg font-semibold text-gray-800">Tambah Jadwal Baru</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 transition w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <form id="task-form" class="p-5 space-y-4">
                <input type="hidden" id="task-id">
                
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Nama / Judul Tugas *</label>
                    <input type="text" id="task-title" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-rimpang-500 focus:border-rimpang-500 outline-none transition" placeholder="Contoh: Desain Konten Media Sosial">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Deskripsi Detail</label>
                    <textarea id="task-desc" rows="3" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-rimpang-500 focus:border-rimpang-500 outline-none transition resize-none" placeholder="Jelaskan detail pekerjaan..."></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Mulai *</label>
                        <input type="date" id="task-start" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-rimpang-500 outline-none text-sm text-gray-700">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Selesai *</label>
                        <input type="date" id="task-end" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-rimpang-500 outline-none text-sm text-gray-700">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Status *</label>
                        <select id="task-status" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-rimpang-500 outline-none text-sm text-gray-700 appearance-none bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%239ca3af%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E')] bg-no-repeat bg-[position:right_1rem_center] bg-[length:10px]">
                            <option value="pending">⏳ Tertunda</option>
                            <option value="progress">🔄 Proses</option>
                            <option value="done">✅ Selesai</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Prioritas</label>
                        <select id="task-priority" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-rimpang-500 outline-none text-sm text-gray-700 appearance-none bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%239ca3af%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E')] bg-no-repeat bg-[position:right_1rem_center] bg-[length:10px]">
                            <option value="low">🟢 Rendah</option>
                            <option value="medium">🟡 Sedang</option>
                            <option value="high">🔴 Tinggi</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">PIC (Penanggung Jawab)</label>
                    <div class="relative">
                        <i class="fa-solid fa-user-tie absolute left-4 top-3 text-gray-400"></i>
                        <input type="text" id="task-pic" class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-rimpang-500 outline-none text-sm text-gray-700" placeholder="Nama PIC">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Lampiran / Gambar Bukti</label>
                    <div class="border-2 border-dashed border-gray-300 rounded-xl p-4 text-center bg-gray-50 hover:bg-gray-100 transition relative">
                        <input type="file" id="task-image" accept="image/jpeg, image/png, image/webp" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="handleImageUpload(event)">
                        
                        <div id="image-upload-prompt" class="flex flex-col items-center pointer-events-none">
                            <i class="fa-solid fa-cloud-arrow-up text-3xl text-gray-400 mb-2"></i>
                            <span class="text-sm text-gray-600 font-medium">Ketuk untuk unggah gambar</span>
                            <span class="text-xs text-gray-400 mt-1">Maks. dikompres otomatis (JPG/PNG)</span>
                        </div>

                        <div id="image-preview-container" class="hidden relative rounded-lg overflow-hidden border border-gray-200 shadow-sm mt-2">
                            <img id="image-preview" src="" alt="Preview" class="w-full object-cover max-h-48">
                            <button type="button" onclick="removeImage(event)" class="absolute top-2 right-2 bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center shadow-md hover:bg-red-600 transition z-10">
                                <i class="fa-solid fa-trash text-sm"></i>
                            </button>
                        </div>
                    </div>
                    <!-- Hidden input to store base64 string -->
                    <input type="hidden" id="task-image-base64">
                </div>

                <div class="pt-4 border-t border-gray-100 flex gap-3">
                    <button type="button" onclick="closeModal()" class="flex-1 px-4 py-3 bg-gray-100 text-gray-700 rounded-xl font-medium hover:bg-gray-200 transition">Batal</button>
                    <button type="submit" id="submit-btn" class="flex-1 px-4 py-3 bg-rimpang-600 text-white rounded-xl font-medium hover:bg-rimpang-700 transition shadow-md flex justify-center items-center">
                        <span id="submit-text">Simpan Jadwal</span>
                        <div id="submit-loader" class="loader hidden ml-2 w-5 h-5 border-[2px]"></div>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Image Modal for Full View -->
    <div id="image-modal" class="modal-overlay fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/90" onclick="closeImageModal()">
        <button class="absolute top-6 right-6 text-white text-3xl hover:text-gray-300">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <img id="full-image" src="" class="max-w-full max-h-[90vh] object-contain rounded-lg shadow-2xl modal-content" onclick="event.stopPropagation()">
    </div>

    <!-- Custom Toast Notification -->
    <div id="toast" class="toast fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-5 py-3 rounded-full shadow-2xl flex items-center z-[70] min-w-[250px] max-w-[90vw]">
        <i id="toast-icon" class="fa-solid fa-circle-check text-green-400 mr-3 text-lg"></i>
        <span id="toast-msg" class="text-sm font-medium">Pesan sukses disini</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Configuration Variables
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'rimpang-digital-kreatif';
        let firebaseConfig = null;
        
        try {
            if (typeof __firebase_config !== 'undefined') {
                firebaseConfig = JSON.parse(__firebase_config);
            }
        } catch (e) {
            console.warn("Using fallback environment for development");
        }

        let app, db, auth;
        let currentUser = null;
        let tasksData = []; // Local state for tasks
        let unsubscribeTasks = null;

        // Validasi Firebase Config
        if (firebaseConfig) {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            
            // Authentication Routine
            const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

            const initAuth = async () => {
                try {
                    if (initialAuthToken) {
                        await signInWithCustomToken(auth, initialAuthToken);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (error) {
                    console.error("Auth error:", error);
                    showToast("Gagal terhubung ke sistem. Coba muat ulang.", "error");
                }
            };

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    setupRealtimeListener();
                }
            });

            initAuth();
        } else {
            document.getElementById('initial-loader').innerHTML = `
                <div class="text-red-500 text-center">
                    <i class="fa-solid fa-triangle-exclamation text-4xl mb-3"></i>
                    <p class="font-medium">Konfigurasi database tidak ditemukan.</p>
                </div>
            `;
        }

        // --- Core Functions ---

        function setupRealtimeListener() {
            if (!currentUser) return;
            
            // STRICT RULE: Must use specific path
            const tasksRef = collection(db, 'artifacts', appId, 'public', 'data', 'schedules');
            
            // RULE: Simple queries only. Fetch all, sort in memory.
            const q = query(tasksRef);
            
            unsubscribeTasks = onSnapshot(q, (snapshot) => {
                tasksData = [];
                snapshot.forEach((doc) => {
                    tasksData.push({ id: doc.id, ...doc.data() });
                });
                
                // Sort by createdAt or Start Date in JS
                tasksData.sort((a, b) => {
                    if (a.createdAt && b.createdAt) {
                        return b.createdAt.toMillis() - a.createdAt.toMillis(); // Descending (newest first)
                    }
                    return 0;
                });

                renderTasks();
                updateStats();
                
            }, (error) => {
                console.error("Error fetching tasks:", error);
                showToast("Gagal memuat data jadwal.", "error");
            });
        }

        // Make essential functions globally available for inline HTML events
        window.openModal = (mode, id = null) => {
            const modal = document.getElementById('task-modal');
            const form = document.getElementById('task-form');
            form.reset();
            document.getElementById('image-preview-container').classList.add('hidden');
            document.getElementById('image-upload-prompt').classList.remove('hidden');
            document.getElementById('task-image-base64').value = "";
            document.getElementById('task-image').value = "";
            
            if (mode === 'add') {
                document.getElementById('modal-title').textContent = "Tambah Jadwal Baru";
                document.getElementById('task-id').value = "";
                // Set default dates to today
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('task-start').value = today;
                document.getElementById('task-end').value = today;
            } else if (mode === 'edit' && id) {
                document.getElementById('modal-title').textContent = "Edit Jadwal";
                const task = tasksData.find(t => t.id === id);
                if (task) {
                    document.getElementById('task-id').value = id;
                    document.getElementById('task-title').value = task.title || "";
                    document.getElementById('task-desc').value = task.description || "";
                    document.getElementById('task-start').value = task.startDate || "";
                    document.getElementById('task-end').value = task.endDate || "";
                    document.getElementById('task-status').value = task.status || "pending";
                    document.getElementById('task-priority').value = task.priority || "medium";
                    document.getElementById('task-pic').value = task.pic || "";
                    
                    if (task.image) {
                        document.getElementById('image-preview').src = task.image;
                        document.getElementById('image-preview-container').classList.remove('hidden');
                        document.getElementById('image-upload-prompt').classList.add('hidden');
                        document.getElementById('task-image-base64').value = task.image;
                    }
                }
            }
            
            modal.classList.add('active');
        };

        window.closeModal = () => {
            document.getElementById('task-modal').classList.remove('active');
        };

        // UI Helpers
        const statusConfig = {
            'pending': { label: 'Tertunda', icon: 'fa-hourglass-half', color: 'text-yellow-600', bg: 'bg-yellow-50', border: 'border-yellow-200' },
            'progress': { label: 'Proses', icon: 'fa-arrows-rotate', color: 'text-blue-600', bg: 'bg-blue-50', border: 'border-blue-200' },
            'done': { label: 'Selesai', icon: 'fa-check-circle', color: 'text-green-600', bg: 'bg-green-50', border: 'border-green-200' }
        };

        const priorityConfig = {
            'low': { label: 'Rendah', dot: 'bg-green-500' },
            'medium': { label: 'Sedang', dot: 'bg-yellow-500' },
            'high': { label: 'Tinggi', dot: 'bg-red-500' }
        };

        const formatDate = (dateStr) => {
            if (!dateStr) return "-";
            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            return new Date(dateStr).toLocaleDateString('id-ID', options);
        };

        function renderTasks() {
            const listEl = document.getElementById('task-list');
            
            if (tasksData.length === 0) {
                listEl.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-20 text-center px-4">
                        <div class="w-24 h-24 bg-rimpang-50 rounded-full flex items-center justify-center mb-4 border border-rimpang-100">
                            <i class="fa-regular fa-calendar-check text-4xl text-rimpang-400"></i>
                        </div>
                        <h3 class="text-lg font-semibold text-gray-700 mb-1">Belum Ada Jadwal</h3>
                        <p class="text-sm text-gray-500">Mulai buat jadwal proyek pertama Anda dengan menekan tombol tambah.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            tasksData.forEach(task => {
                const stat = statusConfig[task.status] || statusConfig['pending'];
                const prio = priorityConfig[task.priority] || priorityConfig['medium'];
                
                // Format image if exists
                let imgHtml = '';
                if (task.image) {
                    imgHtml = `
                        <div class="mt-3 overflow-hidden rounded-xl border border-gray-100 cursor-pointer" onclick="viewImage('${task.image}')">
                            <img src="${task.image}" alt="Lampiran" class="w-full h-32 object-cover hover:opacity-90 transition">
                        </div>
                    `;
                }

                html += `
                    <div class="bg-white p-4 rounded-2xl shadow-[0_2px_10px_rgba(0,0,0,0.03)] border border-gray-100 relative group transition hover:shadow-md">
                        <!-- Action Dropdown / Buttons -->
                        <div class="absolute top-4 right-4 flex gap-2 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition duration-200 bg-white/90 backdrop-blur-sm p-1 rounded-lg">
                            <button onclick="openModal('edit', '${task.id}')" class="w-8 h-8 rounded-full bg-blue-50 text-blue-600 hover:bg-blue-100 flex items-center justify-center" title="Edit">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                            <button onclick="confirmDelete('${task.id}')" class="w-8 h-8 rounded-full bg-red-50 text-red-600 hover:bg-red-100 flex items-center justify-center" title="Hapus">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>

                        <!-- Status & Priority -->
                        <div class="flex items-center gap-2 mb-3">
                            <span class="px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider rounded-full ${stat.bg} ${stat.color} border ${stat.border} flex items-center gap-1.5">
                                <i class="fa-solid ${stat.icon}"></i> ${stat.label}
                            </span>
                            <span class="flex items-center gap-1.5 text-xs text-gray-500 font-medium bg-gray-50 px-2 py-1 rounded-full border border-gray-100">
                                <span class="w-2 h-2 rounded-full ${prio.dot}"></span> ${prio.label}
                            </span>
                        </div>
                        
                        <!-- Title & Desc -->
                        <h3 class="text-lg font-bold text-gray-800 pr-16 leading-tight">${task.title}</h3>
                        ${task.description ? `<p class="text-sm text-gray-500 mt-2 line-clamp-2">${task.description}</p>` : ''}
                        
                        ${imgHtml}

                        <!-- Metadata -->
                        <div class="mt-4 pt-4 border-t border-gray-50 flex flex-wrap gap-4 text-xs font-medium text-gray-500">
                            <div class="flex items-center gap-1.5 bg-gray-50 px-2.5 py-1.5 rounded-lg border border-gray-100">
                                <i class="fa-regular fa-calendar text-rimpang-600"></i>
                                <span>${formatDate(task.startDate)} <i class="fa-solid fa-arrow-right text-[10px] mx-1 opacity-50"></i> ${formatDate(task.endDate)}</span>
                            </div>
                            ${task.pic ? `
                            <div class="flex items-center gap-1.5 bg-gray-50 px-2.5 py-1.5 rounded-lg border border-gray-100">
                                <i class="fa-solid fa-user-tie text-rimpang-600"></i>
                                <span>${task.pic}</span>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        function updateStats() {
            let pending = 0, progress = 0, done = 0;
            tasksData.forEach(t => {
                if (t.status === 'pending') pending++;
                if (t.status === 'progress') progress++;
                if (t.status === 'done') done++;
            });
            
            // Animate counter slightly
            document.getElementById('stat-pending').textContent = pending;
            document.getElementById('stat-progress').textContent = progress;
            document.getElementById('stat-done').textContent = done;
        }

        
        // Image Compression Logic
        window.handleImageUpload = (event) => {
            const file = event.target.files[0];
            if (!file) return;

            // Validasi tipe file
            if (!file.type.match('image.*')) {
                showToast("Hanya file gambar yang diizinkan", "error");
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // Kompresi ukuran max width/height
                    const MAX_SIZE = 800; // Cukup untuk preview dan DB kecil
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_SIZE) {
                            height *= MAX_SIZE / width;
                            width = MAX_SIZE;
                        }
                    } else {
                        if (height > MAX_SIZE) {
                            width *= MAX_SIZE / height;
                            height = MAX_SIZE;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    // Konversi ke base64 (jpeg dengan kualitas 60% agar ukuran kecil di Firestore)
                    const base64String = canvas.toDataURL('image/jpeg', 0.6);
                    
                    document.getElementById('task-image-base64').value = base64String;
                    document.getElementById('image-preview').src = base64String;
                    document.getElementById('image-upload-prompt').classList.add('hidden');
                    document.getElementById('image-preview-container').classList.remove('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.removeImage = (event) => {
            event.stopPropagation();
            document.getElementById('task-image-base64').value = "";
            document.getElementById('task-image').value = "";
            document.getElementById('image-preview').src = "";
            document.getElementById('image-preview-container').classList.add('hidden');
            document.getElementById('image-upload-prompt').classList.remove('hidden');
        };

        window.viewImage = (src) => {
            document.getElementById('full-image').src = src;
            document.getElementById('image-modal').classList.add('active');
        };

        window.closeImageModal = () => {
            document.getElementById('image-modal').classList.remove('active');
        };

        // Form Submit Handler
        document.getElementById('task-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) {
                showToast("Sistem belum siap. Tunggu sebentar.", "error");
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            const submitText = document.getElementById('submit-text');
            const submitLoader = document.getElementById('submit-loader');

            submitBtn.disabled = true;
            submitText.classList.add('hidden');
            submitLoader.classList.remove('hidden');

            const id = document.getElementById('task-id').value;
            
            const taskData = {
                title: document.getElementById('task-title').value.trim(),
                description: document.getElementById('task-desc').value.trim(),
                startDate: document.getElementById('task-start').value,
                endDate: document.getElementById('task-end').value,
                status: document.getElementById('task-status').value,
                priority: document.getElementById('task-priority').value,
                pic: document.getElementById('task-pic').value.trim(),
                image: document.getElementById('task-image-base64').value, // Base64 string terkompresi
                updatedAt: serverTimestamp()
            };

            const tasksRef = collection(db, 'artifacts', appId, 'public', 'data', 'schedules');

            try {
                if (id) {
                    // Update
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'schedules', id);
                    await updateDoc(docRef, taskData);
                    showToast("Jadwal berhasil diperbarui");
                } else {
                    // Add
                    taskData.createdAt = serverTimestamp();
                    taskData.userId = currentUser.uid;
                    await addDoc(tasksRef, taskData);
                    showToast("Jadwal baru ditambahkan");
                }
                closeModal();
            } catch (error) {
                console.error("Error saving task:", error);
                // Menangani error limit Firebase (1MB per doc)
                if(error.code === 'resource-exhausted' || error.message.includes('too large')) {
                    showToast("Gagal: Gambar masih terlalu besar.", "error");
                } else {
                    showToast("Gagal menyimpan data", "error");
                }
            } finally {
                submitBtn.disabled = false;
                submitText.classList.remove('hidden');
                submitLoader.classList.add('hidden');
            }
        });

        // Delete Handler
        window.confirmDelete = (id) => {
            // Custom Confirmation Modal implementation instead of confirm()
            const existingModal = document.getElementById('confirm-modal');
            if (existingModal) existingModal.remove();

            const modalHtml = `
            <div id="confirm-modal" class="modal-overlay fixed inset-0 z-[80] flex items-center justify-center p-4 active bg-black/50">
                <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl text-center transform scale-100 transition-transform">
                    <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4 text-red-500 text-3xl">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                    </div>
                    <h3 class="text-lg font-bold text-gray-800 mb-2">Hapus Jadwal?</h3>
                    <p class="text-sm text-gray-500 mb-6">Tindakan ini tidak dapat dibatalkan dan jadwal akan terhapus dari semua perangkat.</p>
                    <div class="flex gap-3">
                        <button onclick="closeConfirmModal()" class="flex-1 px-4 py-2.5 bg-gray-100 text-gray-700 rounded-xl font-medium hover:bg-gray-200 transition">Batal</button>
                        <button onclick="executeDelete('${id}')" class="flex-1 px-4 py-2.5 bg-red-500 text-white rounded-xl font-medium hover:bg-red-600 transition shadow-md">Ya, Hapus</button>
                    </div>
                </div>
            </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        };

        window.closeConfirmModal = () => {
            const modal = document.getElementById('confirm-modal');
            if(modal) modal.remove();
        };

        window.executeDelete = async (id) => {
            if (!currentUser) return;
            closeConfirmModal();
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'schedules', id);
                await deleteDoc(docRef);
                showToast("Jadwal dihapus");
            } catch (error) {
                console.error("Error deleting:", error);
                showToast("Gagal menghapus jadwal", "error");
            }
        };

        let toastTimeout;
        window.showToast = (message, type = "success") => {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-msg');
            const iconEl = document.getElementById('toast-icon');

            msgEl.textContent = message;
            
            if (type === "success") {
                iconEl.className = "fa-solid fa-circle-check text-green-400 mr-3 text-lg";
                toast.className = "toast fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-5 py-3 rounded-full shadow-2xl flex items-center z-[70] min-w-[250px] max-w-[90vw] show border border-gray-700";
            } else {
                iconEl.className = "fa-solid fa-circle-xmark text-red-400 mr-3 text-lg";
                toast.className = "toast fixed bottom-6 left-1/2 -translate-x-1/2 bg-red-900 text-white px-5 py-3 rounded-full shadow-2xl flex items-center z-[70] min-w-[250px] max-w-[90vw] show border border-red-700";
            }

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        };

        // Export to JPG Feature using html2canvas
        window.downloadJPG = async () => {
            const captureArea = document.getElementById('capture-area');
            const watermark = document.getElementById('export-watermark');
            const dateSpan = document.getElementById('export-date');
            
            // Set current date in watermark
            const now = new Date();
            dateSpan.textContent = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            
            // Show watermark briefly for export
            watermark.classList.remove('hidden');
            showToast("Menyiapkan unduhan, mohon tunggu...");
            
            try {
                const canvas = await html2canvas(captureArea, {
                    scale: 2, // High quality
                    useCORS: true, // Allow external images (if any)
                    allowTaint: true,
                    backgroundColor: "#f9fafb", // Tailwind gray-50
                    windowWidth: captureArea.scrollWidth,
                    windowHeight: captureArea.scrollHeight,
                    logging: false
                });

                // Hide watermark back
                watermark.classList.add('hidden');

                // Convert canvas to JPG
                const imageString = canvas.toDataURL("image/jpeg", 1.0);
                
                // Create download link
                const link = document.createElement('a');
                link.download = `Jadwal_Project_Rimpang_${now.getTime()}.jpg`;
                link.href = imageString;
                link.click();
                
                showToast("Gambar berhasil diunduh!");
            } catch (error) {
                console.error("Export error:", error);
                watermark.classList.add('hidden');
                showToast("Gagal memproses gambar.", "error");
            }
        };

        // Escape key to close modals
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
                closeImageModal();
                closeConfirmModal();
            }
        });

    </script>
</body>
</html>
